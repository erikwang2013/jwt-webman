<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="archTitle archDesc"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <title id="archTitle">erikwang2013/jwt-webman 架构设计</title>
  <desc id="archDesc">四层架构：接入层（原生 PHP Guard 与 webman / Laravel / ThinkPHP / Hyperf 四框架适配）、框架无关核心层（JWT / JWTFactory / JwtWrapper / 支撑组件）、可插拔存储层（TokenStorageInterface + RetryTokenStorage 装饰器 + redis / database / file / memcached 四驱动）、底层依赖（firebase/php-jwt 与 PSR-3 日志）。</desc>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="720" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>

  <text x="40" y="52" font-size="22" font-weight="700" fill="#0F172A">架构设计 · Architecture</text>
  <text x="40" y="78" font-size="13" fill="#64748B">一套框架无关内核 + 五种接入方式 + 四种存储驱动，外部依赖全部构造注入</text>

  <!-- ══════════ 接入层 ══════════ -->
  <rect x="40" y="100" width="880" height="132" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="56" y="126" font-size="13" font-weight="700" fill="#7C3AED">接入层 · Integrations（原生 PHP 与四框架，彼此互不感知）</text>

  <rect x="56" y="136" width="163" height="84" rx="10" fill="#FAF5FF" stroke="#DDD6FE"/>
  <text x="68" y="158" font-size="13" font-weight="700" fill="#6D28D9">原生 PHP</text>
  <text x="68" y="176" font-size="10.5" fill="#6B7280">Guard 请求守卫</text>
  <text x="68" y="193" font-size="10.5" fill="#6B7280">createFromFile()</text>
  <text x="68" y="210" font-size="10.5" fill="#6B7280">零框架依赖</text>

  <rect x="231" y="136" width="163" height="84" rx="10" fill="#FAF5FF" stroke="#DDD6FE"/>
  <text x="243" y="158" font-size="13" font-weight="700" fill="#6D28D9">webman</text>
  <text x="243" y="176" font-size="10.5" fill="#6B7280">Middleware</text>
  <text x="243" y="193" font-size="10.5" fill="#6B7280">插件自动注册</text>
  <text x="243" y="210" font-size="10.5" fill="#6B7280">Install 入口</text>

  <rect x="406" y="136" width="163" height="84" rx="10" fill="#FAF5FF" stroke="#DDD6FE"/>
  <text x="418" y="158" font-size="13" font-weight="700" fill="#6D28D9">Laravel</text>
  <text x="418" y="176" font-size="10.5" fill="#6B7280">ServiceProvider</text>
  <text x="418" y="193" font-size="10.5" fill="#6B7280">Facade · Middleware</text>
  <text x="418" y="210" font-size="10.5" fill="#6B7280">InstallCommand</text>

  <rect x="581" y="136" width="163" height="84" rx="10" fill="#FAF5FF" stroke="#DDD6FE"/>
  <text x="593" y="158" font-size="13" font-weight="700" fill="#6D28D9">ThinkPHP</text>
  <text x="593" y="176" font-size="10.5" fill="#6B7280">Service · Facade</text>
  <text x="593" y="193" font-size="10.5" fill="#6B7280">Middleware</text>
  <text x="593" y="210" font-size="10.5" fill="#6B7280">InstallCommand</text>

  <rect x="756" y="136" width="163" height="84" rx="10" fill="#FAF5FF" stroke="#DDD6FE"/>
  <text x="768" y="158" font-size="13" font-weight="700" fill="#6D28D9">Hyperf</text>
  <text x="768" y="176" font-size="10.5" fill="#6B7280">ConfigProvider</text>
  <text x="768" y="193" font-size="10.5" fill="#6B7280">Middleware · AOP</text>
  <text x="768" y="210" font-size="10.5" fill="#6B7280">#[JWT] · InstallCommand</text>

  <path d="M137 234 V256" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M312 234 V256" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M487 234 V256" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M662 234 V256" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M837 234 V256" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- ══════════ 核心层 ══════════ -->
  <rect x="40" y="262" width="880" height="176" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="56" y="286" font-size="13" font-weight="700" fill="#2563EB">核心层 · Core（零框架依赖，仅依赖 firebase/php-jwt 与 PSR-3）</text>

  <rect x="56" y="300" width="207" height="122" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="70" y="328" font-size="14" font-weight="700" fill="#1D4ED8">JWT</text>
  <text x="70" y="350" font-size="11" fill="#475569">encode 签发 · decode 校验</text>
  <text x="70" y="368" font-size="11" fill="#475569">refresh 刷新 · blacklist 拉黑</text>
  <text x="70" y="386" font-size="11" fill="#475569">iss / aud / leeway 校验</text>
  <text x="70" y="404" font-size="11" fill="#475569">validate · cleanup 清理</text>

  <rect x="275" y="300" width="207" height="122" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="289" y="328" font-size="14" font-weight="700" fill="#1D4ED8">JWTFactory</text>
  <text x="289" y="350" font-size="11" fill="#475569">createFromConfig() 入口</text>
  <text x="289" y="368" font-size="11" fill="#475569">按 storage.type 选驱动</text>
  <text x="289" y="386" font-size="11" fill="#475569">装配 RetryTokenStorage</text>
  <text x="289" y="404" font-size="11" fill="#475569">注册自动清理钩子</text>

  <rect x="494" y="300" width="207" height="122" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="508" y="328" font-size="14" font-weight="700" fill="#1D4ED8">JwtWrapper</text>
  <text x="508" y="350" font-size="11" fill="#475569">create · verify · validate</text>
  <text x="508" y="368" font-size="11" fill="#475569">decode · refresh · blacklist</text>
  <text x="508" y="386" font-size="11" fill="#475569">自动获取 Bearer Token</text>
  <text x="508" y="404" font-size="11" fill="#475569">四框架一致的使用体验</text>

  <rect x="713" y="300" width="207" height="122" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="727" y="328" font-size="14" font-weight="700" fill="#1D4ED8">支撑组件 Support</text>
  <text x="727" y="350" font-size="11" fill="#475569">Config 配置容器</text>
  <text x="727" y="368" font-size="11" fill="#475569">JWTException 异常层级</text>
  <text x="727" y="386" font-size="11" fill="#475569">MiddlewareSupport 基座</text>
  <text x="727" y="404" font-size="11" fill="#475569">TokenStorageInterface 抽象</text>

  <path d="M300 440 V464" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M660 440 V464" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- ══════════ 存储层 ══════════ -->
  <rect x="40" y="470" width="880" height="150" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="56" y="496" font-size="13" font-weight="700" fill="#0D9488">存储层 · Storage（黑名单驱动，配置一行切换）</text>

  <rect x="56" y="510" width="170" height="94" rx="10" fill="#F0FDFA" stroke="#99F6E4"/>
  <text x="68" y="532" font-size="11.5" font-weight="700" fill="#0F766E">TokenStorageInterface</text>
  <text x="68" y="552" font-size="11" fill="#475569">RetryTokenStorage</text>
  <text x="68" y="572" font-size="11" fill="#475569">装饰器 · 失败自动重试</text>
  <text x="68" y="592" font-size="11" fill="#475569">fail_open 故障放行/拒绝</text>

  <path d="M234 557 H266" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="272" y="510" width="153" height="94" rx="10" fill="#F0FDFA" stroke="#99F6E4"/>
  <text x="286" y="540" font-size="13" font-weight="700" fill="#0F766E">Redis</text>
  <text x="286" y="566" font-size="11" fill="#475569">分布式部署首选</text>
  <text x="286" y="586" font-size="11" fill="#475569">连接注入 · DB 可配</text>

  <rect x="437" y="510" width="153" height="94" rx="10" fill="#F0FDFA" stroke="#99F6E4"/>
  <text x="451" y="540" font-size="13" font-weight="700" fill="#0F766E">Database</text>
  <text x="451" y="566" font-size="11" fill="#475569">持久化 / 跨数据中心</text>
  <text x="451" y="586" font-size="11" fill="#475569">PDO 注入 · 表名可配</text>

  <rect x="602" y="510" width="153" height="94" rx="10" fill="#F0FDFA" stroke="#99F6E4"/>
  <text x="616" y="540" font-size="13" font-weight="700" fill="#0F766E">File</text>
  <text x="616" y="566" font-size="11" fill="#475569">单机部署 · 低并发</text>
  <text x="616" y="586" font-size="11" fill="#475569">路径可配 · 概率 GC</text>

  <rect x="767" y="510" width="153" height="94" rx="10" fill="#F0FDFA" stroke="#99F6E4"/>
  <text x="781" y="540" font-size="13" font-weight="700" fill="#0F766E">Memcached</text>
  <text x="781" y="566" font-size="11" fill="#475569">高吞吐 · 自动过期</text>
  <text x="781" y="586" font-size="11" fill="#475569">服务器列表可配</text>

  <!-- ══════════ 底层依赖 ══════════ -->
  <text x="40" y="650" font-size="12" font-weight="700" fill="#64748B">底层依赖 · Dependencies</text>
  <rect x="40" y="662" width="430" height="42" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="56" y="688" font-size="11.5" fill="#475569">firebase/php-jwt ^7.0 —— JWT 编解码引擎</text>
  <rect x="490" y="662" width="430" height="42" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="506" y="688" font-size="11.5" fill="#475569">psr/log —— 日志输出，未注入时使用 NullLogger</text>
</svg>
