<svg xmlns="http://www.w3.org/2000/svg" width="240" height="310" viewBox="0 0 240 310" role="img" aria-labelledby="keeTitle keeDesc" shape-rendering="geometricPrecision">
  <title id="keeTitle">钥匙小卫 Kee — erikwang2013/jwt-webman 项目宠物</title>
  <desc id="keeDesc">一只坐姿的柴犬门卫：颈圈上挂着一把带六颗齿的金色钥匙吊牌，钥匙柄嵌着蓝色盾牌；它抬起一只前爪，示意校验令牌后放行。</desc>
  <defs>
    <linearGradient id="keeFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8C66F"/>
      <stop offset=".55" stop-color="#EAA24B"/>
      <stop offset="1" stop-color="#D98932"/>
    </linearGradient>
    <linearGradient id="keeCream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF9EC"/>
      <stop offset="1" stop-color="#FBE8C9"/>
    </linearGradient>
    <linearGradient id="keeGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset=".5" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="keeShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="keeCollar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E4E6E"/>
      <stop offset="1" stop-color="#12344C"/>
    </linearGradient>
  </defs>

  <!-- 地面投影 -->
  <ellipse cx="120" cy="290" rx="76" ry="10" fill="#0F172A" opacity=".10"/>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" keyTimes="0;.5;1" dur="3.6s" repeatCount="indefinite"/>

    <!-- 尾巴（卷在身后） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 170 246;4 170 246;0 170 246" keyTimes="0;.5;1" dur="2.9s" repeatCount="indefinite"/>
      <path d="M170 246 C202 258 222 236 216 210 C212 188 190 180 176 194 C165 205 170 220 183 218 C192 216 193 204 184 200"
            fill="none" stroke="#23304A" stroke-width="20" stroke-linecap="round"/>
      <path d="M170 246 C202 258 222 236 216 210 C212 188 190 180 176 194 C165 205 170 220 183 218 C192 216 193 204 184 200"
            fill="none" stroke="url(#keeFur)" stroke-width="13" stroke-linecap="round"/>
      <path d="M183 218 C192 216 193 204 184 200"
            fill="none" stroke="url(#keeCream)" stroke-width="5" stroke-linecap="round" opacity=".95"/>
    </g>

    <!-- 后腿与后爪（垫在身体两侧） -->
    <path d="M80 226 C62 230 52 248 58 266 C63 279 84 282 94 272 C104 262 100 238 90 228 Z"
          fill="url(#keeFur)" stroke="#23304A" stroke-width="5" stroke-linejoin="round"/>
    <path d="M160 226 C178 230 188 248 182 266 C177 279 156 282 146 272 C136 262 140 238 150 228 Z"
          fill="url(#keeFur)" stroke="#23304A" stroke-width="5" stroke-linejoin="round"/>

    <!-- 身体 -->
    <path d="M84 148 C70 176 64 216 68 248 C70 266 86 277 120 277 C154 277 170 266 172 248 C176 216 170 176 156 148 Z"
          fill="url(#keeFur)" stroke="#23304A" stroke-width="5" stroke-linejoin="round"/>

    <!-- 胸前奶油色毛发 -->
    <path d="M120 146 C104 146 95 160 95 186 C95 216 101 246 109 262 C113 270 127 270 131 262 C139 246 145 216 145 186 C145 160 136 146 120 146 Z"
          fill="url(#keeCream)"/>

    <!-- 站立的右前腿 -->
    <path d="M100 196 C96 218 96 248 98 264 C100 273 114 273 116 264 C118 248 118 218 114 196 Z"
          fill="url(#keeFur)" stroke="#23304A" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="107" cy="270" rx="14" ry="9" fill="url(#keeCream)" stroke="#23304A" stroke-width="4.5"/>
    <path d="M102 268 v5 M107 267 v6 M112 268 v5" stroke="#23304A" stroke-width="1.9" stroke-linecap="round" opacity=".5"/>

    <!-- 后爪 -->
    <ellipse cx="70" cy="274" rx="17" ry="9" fill="url(#keeCream)" stroke="#23304A" stroke-width="4.5"/>
    <ellipse cx="170" cy="274" rx="17" ry="9" fill="url(#keeCream)" stroke="#23304A" stroke-width="4.5"/>
    <path d="M64 272 v5 M70 271 v6 M76 272 v5" stroke="#23304A" stroke-width="1.9" stroke-linecap="round" opacity=".45"/>
    <path d="M164 272 v5 M170 271 v6 M176 272 v5" stroke="#23304A" stroke-width="1.9" stroke-linecap="round" opacity=".45"/>

    <!-- 颈圈 -->
    <g>
      <path d="M78 144 C94 166 146 166 162 144 L165 160 C146 182 94 182 75 160 Z"
            fill="url(#keeCollar)" stroke="#23304A" stroke-width="5" stroke-linejoin="round"/>
      <path d="M81 152 C97 172 143 172 159 152" fill="none" stroke="#7DD3FC" stroke-width="1.6" stroke-dasharray="4 4" opacity=".5"/>
      <rect x="82" y="147" width="15" height="11" rx="3" fill="url(#keeGold)" stroke="#23304A" stroke-width="3" transform="rotate(-8 89 152)"/>
      <circle cx="126" cy="170" r="5" fill="none" stroke="url(#keeGold)" stroke-width="3"/>
    </g>

    <!-- 钥匙吊牌：六齿 = 六个框架适配层，盾牌 = 校验与黑名单 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2 126 170;2 126 170;-2 126 170" keyTimes="0;.5;1" dur="3.4s" repeatCount="indefinite"/>

      <!-- 钥匙柄 -->
      <circle cx="126" cy="190" r="15" fill="url(#keeGold)" stroke="#23304A" stroke-width="4"/>
      <!-- 盾牌嵌片 -->
      <path d="M126 181 L134 184 V190 C134 196 130.5 199.5 126 202 C121.5 199.5 118 196 118 190 V184 Z"
            fill="url(#keeShield)" stroke="#23304A" stroke-width="2"/>
      <path d="M121.5 190 L124.5 193 L130.5 186.5" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="120.5" cy="186" r=".9" fill="#DBEAFE"/>
      <circle cx="131.5" cy="186" r=".9" fill="#DBEAFE"/>
      <circle cx="121.5" cy="196.5" r=".9" fill="#DBEAFE"/>
      <circle cx="130.5" cy="196.5" r=".9" fill="#DBEAFE"/>

      <!-- 钥匙刃与六颗齿 -->
      <path d="M121 204 L121 248 Q121 254 126 254 Q131 254 131 250
               L131 249.5 L140 249.5 L140 245.5 L131 245.5
               L131 242 L140 242 L140 238 L131 238
               L131 234.5 L140 234.5 L140 230.5 L131 230.5
               L131 227 L140 227 L140 223 L131 223
               L131 219.5 L140 219.5 L140 215.5 L131 215.5
               L131 212 L140 212 L140 208 L131 208
               L131 204 Z"
            fill="url(#keeGold)" stroke="#23304A" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M125 208 V246" stroke="#FFF7D6" stroke-width="1.6" stroke-linecap="round" opacity=".65"/>
    </g>

    <!-- 抬起的左前爪：示意「出示令牌」 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 154 194;-4 154 194;0 154 194" keyTimes="0;.5;1" dur="2.3s" repeatCount="indefinite"/>
      <path d="M154 194 C168 190 176 179 182 164" fill="none" stroke="#23304A" stroke-width="22" stroke-linecap="round"/>
      <path d="M154 194 C168 190 176 179 182 164" fill="none" stroke="url(#keeFur)" stroke-width="14" stroke-linecap="round"/>
      <g transform="rotate(-14 184 156)">
        <ellipse cx="184" cy="156" rx="12" ry="14" fill="url(#keeCream)" stroke="#23304A" stroke-width="4.5"/>
        <ellipse cx="184" cy="160" rx="5.5" ry="5" fill="#F3B39B" opacity=".9"/>
        <circle cx="178.5" cy="151" r="2.1" fill="#F3B39B"/>
        <circle cx="184" cy="149" r="2.1" fill="#F3B39B"/>
        <circle cx="189.5" cy="151" r="2.1" fill="#F3B39B"/>
      </g>
    </g>

    <!-- 头（轻微歪头，增加性格） -->
    <g transform="rotate(-2.5 120 100)">
      <!-- 耳朵 -->
      <path d="M82 66 L64 16 L108 42 Z" fill="url(#keeFur)" stroke="#23304A" stroke-width="5" stroke-linejoin="round"/>
      <path d="M158 66 L176 16 L132 42 Z" fill="url(#keeFur)" stroke="#23304A" stroke-width="5" stroke-linejoin="round"/>
      <path d="M86 58 L76 31 L98 45 Z" fill="#F3B39B"/>
      <path d="M154 58 L164 31 L142 45 Z" fill="#F3B39B"/>

      <!-- 头 -->
      <path d="M120 46 C97 46 79 57 73 76 C70 88 70 101 74 111 L64 118 L78 122 C87 135 102 148 120 148 C138 148 153 135 162 122 L176 118 L166 111 C170 101 170 88 167 76 C161 57 143 46 120 46 Z"
            fill="url(#keeFur)" stroke="#23304A" stroke-width="5" stroke-linejoin="round"/>

      <!-- 奶油色口鼻与脸颊 -->
      <path d="M120 94 C104 94 92 101 88 112 C85 122 94 132 106 136 C111 138 115 141 120 141 C125 141 129 138 134 136 C146 132 155 122 152 112 C148 101 136 94 120 94 Z"
            fill="url(#keeCream)"/>

      <!-- 眉点（柴犬标志） -->
      <ellipse cx="100" cy="82" rx="7" ry="3.4" fill="url(#keeCream)" transform="rotate(-6 100 82)"/>
      <ellipse cx="140" cy="82" rx="7" ry="3.4" fill="url(#keeCream)" transform="rotate(6 140 82)"/>

      <!-- 眼睛 -->
      <ellipse cx="100" cy="99" rx="6.5" ry="8" fill="#2A2433">
        <animate attributeName="ry" values="8;8;1;8" keyTimes="0;.93;.96;1" dur="4.8s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="140" cy="99" rx="6.5" ry="8" fill="#2A2433">
        <animate attributeName="ry" values="8;8;1;8" keyTimes="0;.93;.96;1" dur="4.8s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="98" cy="95.5" r="2.2" fill="#FFFFFF"/>
      <circle cx="138" cy="95.5" r="2.2" fill="#FFFFFF"/>
      <circle cx="102" cy="102" r="1" fill="#FFFFFF" opacity=".75"/>
      <circle cx="142" cy="102" r="1" fill="#FFFFFF" opacity=".75"/>

      <!-- 鼻子与嘴 -->
      <path d="M113 111 Q120 107 127 111 Q124 119 120 120 Q116 119 113 111 Z" fill="#2A2433"/>
      <ellipse cx="117" cy="110.5" rx="2" ry="1.1" fill="#FFFFFF" opacity=".45"/>
      <path d="M120 120 V124" fill="none" stroke="#2A2433" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M120 124 Q114 130 109 125 M120 124 Q126 130 131 125" fill="none" stroke="#2A2433" stroke-width="2.4" stroke-linecap="round"/>

      <!-- 胡须点与腮红 -->
      <g fill="#2A2433" opacity=".3">
        <circle cx="99" cy="119" r="1"/><circle cx="105" cy="122" r="1"/><circle cx="99" cy="125" r="1"/>
        <circle cx="141" cy="119" r="1"/><circle cx="135" cy="122" r="1"/><circle cx="141" cy="125" r="1"/>
      </g>
      <ellipse cx="85" cy="114" rx="8" ry="5" fill="#FB7185" opacity=".25"/>
      <ellipse cx="155" cy="114" rx="8" ry="5" fill="#FB7185" opacity=".25"/>
    </g>
  </g>

  <!-- 光点 -->
  <path d="M42 52 l3.2 6.8 6.8 3.2 -6.8 3.2 -3.2 6.8 -3.2 -6.8 -6.8 -3.2 6.8 -3.2 z" fill="#FBBF24">
    <animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/>
  </path>
  <path d="M206 138 l2.6 5.4 5.4 2.6 -5.4 2.6 -2.6 5.4 -2.6 -5.4 -5.4 -2.6 5.4 -2.6 z" fill="#2563EB">
    <animate attributeName="opacity" values=".2;1;.2" dur="2.8s" begin="0.9s" repeatCount="indefinite"/>
  </path>
  <path d="M190 70 l2.2 4.6 4.6 2.2 -4.6 2.2 -2.2 4.6 -2.2 -4.6 -4.6 -2.2 4.6 -2.2 z" fill="#0D9488">
    <animate attributeName="opacity" values=".2;1;.2" dur="2.8s" begin="1.7s" repeatCount="indefinite"/>
  </path>
</svg>
