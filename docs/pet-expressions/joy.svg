        <ellipse cx="155" cy="114" rx="8" ry="5" fill="#F9A8B8"/>        <g transform="translate(148 78)"><circle class="ex-anim-confetti" style="animation-delay:0s" r="2.2" fill="#FF6B9D"/></g>
        <g transform="translate(140 92)"><rect class="ex-anim-confetti" style="animation-delay:.16s" x="-1.5" y="-3" width="3" height="6" rx="1" fill="#FFD166"/></g>
