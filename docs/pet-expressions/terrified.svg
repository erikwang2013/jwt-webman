<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 240 310" width="240" height="310" role="img" aria-label="钥匙小卫 Kee · 惊恐 Terrified"><title>钥匙小卫 Kee · 惊恐 Terrified</title><desc>钥匙小卫 Kee 的 惊恐 表情形态 · animated expression form</desc><style>
.ex-motion { animation: ex-tremble 0.18s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
