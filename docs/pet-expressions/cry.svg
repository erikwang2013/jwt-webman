<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 240 310" width="240" height="310" role="img" aria-label="钥匙小卫 Kee · 哭 Cry"><title>钥匙小卫 Kee · 哭 Cry</title><desc>钥匙小卫 Kee 的 哭 表情形态 · animated expression form</desc><style>
.ex-motion { animation: ex-sob 0.9s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
