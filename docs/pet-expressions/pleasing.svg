<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 240 310" width="240" height="310" role="img" aria-label="钥匙小卫 Kee · 讨好 Pleasing"><title>钥匙小卫 Kee · 讨好 Pleasing</title><desc>钥匙小卫 Kee 的 讨好 表情形态 · animated expression form</desc><style>
.ex-motion { animation: ex-nod 1.7s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
.ex-anim-tear { animation: ex-tear 1.8s ease-in infinite; transform-box: fill-box; transform-origin: center; }
