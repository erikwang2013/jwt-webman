<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 240 310" width="240" height="310" role="img" aria-label="钥匙小卫 Kee · 卖萌 Cute"><title>钥匙小卫 Kee · 卖萌 Cute</title><desc>钥匙小卫 Kee 的 卖萌 表情形态 · animated expression form</desc><style>
.ex-motion { animation: ex-hop 1.5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
