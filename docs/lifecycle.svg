<svg xmlns="http://www.w3.org/2000/svg" width="960" height="730" viewBox="0 0 960 730" role="img" aria-labelledby="lifeTitle lifeDesc"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <title id="lifeTitle">erikwang2013/jwt-webman 令牌生命周期</title>
  <desc id="lifeDesc">令牌从签发、下发、校验、放行、刷新、拉黑到过期清理的七个阶段，以及 Active → In Use → Refreshed / Blacklisted → Expired → Cleaned 的状态流转。</desc>
  <defs>
    <marker id="lar" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="730" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="40" y="52" font-size="22" font-weight="700" fill="#0F172A">令牌生命周期 · Lifecycle</text>
  <text x="40" y="78" font-size="13" fill="#64748B">一枚 JWT 从签发到销毁的七个阶段：中间件自动完成第 3、4 步，其余步骤由业务代码按需调用</text>

  <!-- 时间轴主线 -->
  <line x1="68" y1="136" x2="68" y2="580" stroke="#CBD5E1" stroke-width="2"/>

  <!-- ① 签发 -->
  <rect x="40" y="104" width="880" height="64" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="68" cy="136" r="15" fill="#F59E0B"/>
  <text x="68" y="141" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="104" y="130" font-size="14" font-weight="700" fill="#0F172A">签发 <tspan font-size="11" font-weight="400" fill="#B45309">encode()</tspan></text>
  <text x="104" y="154" font-size="11.5" fill="#475569">服务端校验用户凭证后签发；自动写入 iss / aud / iat / nbf / exp / jti，默认有效期 3600s，刷新令牌 7200s</text>

  <!-- ② 下发 -->
  <rect x="40" y="178" width="880" height="64" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="68" cy="210" r="15" fill="#F59E0B"/>
  <text x="68" y="215" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="104" y="204" font-size="14" font-weight="700" fill="#0F172A">下发 <tspan font-size="11" font-weight="400" fill="#B45309">Response</tspan></text>
  <text x="104" y="228" font-size="11.5" fill="#475569">令牌返回客户端；客户端保存后随每次请求携带 Authorization: Bearer &lt;token&gt;</text>

  <!-- ③ 校验 -->
  <rect x="40" y="252" width="880" height="64" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="68" cy="284" r="15" fill="#2563EB"/>
  <text x="68" y="289" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="104" y="278" font-size="14" font-weight="700" fill="#0F172A">校验 <tspan font-size="11" font-weight="400" fill="#1D4ED8">decode() ／ 中间件</tspan></text>
  <text x="104" y="302" font-size="11.5" fill="#475569">验签 → 校验 exp / nbf（含 leeway 时钟容差）→ 比对 iss / aud → 查询 jti 是否已在黑名单（存储故障默认拒绝）</text>

  <!-- ④ 放行 / 拒绝 -->
  <rect x="40" y="326" width="880" height="64" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="68" cy="358" r="15" fill="#2563EB"/>
  <text x="68" y="363" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="104" y="352" font-size="14" font-weight="700" fill="#0F172A">放行 / 拒绝 <tspan font-size="11" font-weight="400" fill="#1D4ED8">Middleware</tspan></text>
  <text x="104" y="376" font-size="11.5" fill="#475569">通过则注入 payload（webman: $request-&gt;jwt_payload ／ Laravel: request attributes）并进入业务；失败抛 JWTException → 401</text>

  <!-- ⑤ 刷新 -->
  <rect x="40" y="400" width="880" height="64" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="68" cy="432" r="15" fill="#7C3AED"/>
  <text x="68" y="437" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="104" y="426" font-size="14" font-weight="700" fill="#0F172A">刷新 <tspan font-size="11" font-weight="400" fill="#6D28D9">refresh()</tspan></text>
  <text x="104" y="450" font-size="11.5" fill="#475569">用 refresh 令牌换取新令牌；旧 jti 立即写入黑名单完成轮换，新令牌有效期默认取 refresh_expire</text>

  <!-- ⑥ 拉黑 -->
  <rect x="40" y="474" width="880" height="64" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="68" cy="506" r="15" fill="#E11D48"/>
  <text x="68" y="511" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="104" y="500" font-size="14" font-weight="700" fill="#0F172A">拉黑 <tspan font-size="11" font-weight="400" fill="#BE123C">blacklist()　登出 / 改密 / 风控</tspan></text>
  <text x="104" y="524" font-size="11.5" fill="#475569">主动作废尚未过期的令牌；即使令牌已过期或已在黑名单，仍会补写记录，保证幂等</text>

  <!-- ⑦ 过期与清理 -->
  <rect x="40" y="548" width="880" height="64" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="68" cy="580" r="15" fill="#0D9488"/>
  <text x="68" y="585" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
  <text x="104" y="574" font-size="14" font-weight="700" fill="#0F172A">过期与清理 <tspan font-size="11" font-weight="400" fill="#0F766E">cleanup()</tspan></text>
  <text x="104" y="598" font-size="11.5" fill="#475569">过期令牌自然失效；黑名单条目按 exp 到期回收 —— 定时任务、概率 GC 或 register_shutdown_function</text>

  <!-- 状态流转 -->
  <rect x="40" y="636" width="880" height="74" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="56" y="662" font-size="12" font-weight="700" fill="#64748B">令牌状态流转 · State Machine</text>

  <rect x="56" y="674" width="140" height="32" rx="8" fill="#F0FDFA" stroke="#5EEAD4"/>
  <text x="126" y="695" font-size="11.5" font-weight="600" fill="#0F766E" text-anchor="middle">已签发 Active</text>
  <path d="M200 690 H222" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#lar)"/>

  <rect x="230" y="674" width="140" height="32" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="300" y="695" font-size="11.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">使用中 In Use</text>
  <path d="M374 690 H396" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#lar)"/>

  <rect x="404" y="674" width="140" height="32" rx="8" fill="#FAF5FF" stroke="#DDD6FE"/>
  <text x="474" y="695" font-size="11.5" font-weight="600" fill="#6D28D9" text-anchor="middle">已刷新 / 已拉黑</text>
  <path d="M548 690 H570" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#lar)"/>

  <rect x="578" y="674" width="140" height="32" rx="8" fill="#FFF1F2" stroke="#FECDD3"/>
  <text x="648" y="695" font-size="11.5" font-weight="600" fill="#BE123C" text-anchor="middle">已过期 Expired</text>
  <path d="M722 690 H744" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#lar)"/>

  <rect x="752" y="674" width="140" height="32" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="822" y="695" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle">已清理 Cleaned</text>
</svg>
