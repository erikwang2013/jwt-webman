name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve next version
        id: version
        run: |
          latest=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 | sed 's/^v//')
          latest=${latest:-0.0.0}
          bump=patch
          while read -r msg; do
            case "$msg" in
              *BREAKING*|*'major:'*) bump=major ;;
              *'feat:'*|*'feature:'*|*'minor:'*|*'新增'*|*'特性'*) [ "$bump" = patch ] && bump=minor ;;
            esac
          base=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          done < <(git log "$base..HEAD" --format=%s 2>/dev/null)
          IFS='.' read -r maj min pat <<< "$latest"
          case "$bump" in
            major) maj=$((maj + 1)); min=0; pat=0 ;;
            minor) min=$((min + 1)); pat=0 ;;
            *) pat=$((pat + 1)) ;;
          esac
          echo "tag=v$maj.$min.$pat" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists, skipping release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" --generate-notes --title "$tag"
