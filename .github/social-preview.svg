    <ellipse cx="102" cy="271" rx="14" ry="9" fill="#FFF6E6" stroke="#2B3445" stroke-width="6"/>
    <ellipse cx="138" cy="271" rx="14" ry="9" fill="#FFF6E6" stroke="#2B3445" stroke-width="6"/>

