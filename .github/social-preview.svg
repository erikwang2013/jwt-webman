      <path d="M174 212 C180 200 198 200 204 214" fill="none" stroke="#FFF6E6" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- 身体 -->
    <path d="M80 164 C66 194 62 232 66 254 C70 270 90 278 120 278 C150 278 170 270 174 254 C178 232 174 194 160 164 Z"
