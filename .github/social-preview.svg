<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="spTitle spDesc" shape-rendering="geometricPrecision">
  <title id="spTitle">erikwang2013/jwt-webman — PHP 多框架 JWT 认证插件</title>
  <desc id="spDesc">Social Preview：一套内核、七种接入；右侧是扁平卡通柴犬门卫钥匙小卫 Kee。</desc>

  <rect width="1280" height="640" fill="#FFF8EC"/>
  <circle cx="960" cy="330" r="248" fill="#FBE3C4"/>

  <g font-family="'Noto Sans CJK SC','Source Han Sans SC',sans-serif" fill="#2B3445">
    <text x="88" y="180" font-size="28" font-weight="700" letter-spacing="1.2">erikwang2013/jwt-webman</text>
    <text x="84" y="292" font-size="92" font-weight="700">一套内核</text>
    <text x="84" y="392" font-size="92" font-weight="700" fill="#E8892B">七种接入</text>
    <text x="90" y="458" font-size="34" font-weight="500">PHP 多框架 JWT 认证插件</text>
    <rect x="90" y="488" width="96" height="8" rx="4" fill="#F7C64A"/>
    <text x="90" y="542" font-size="23" font-weight="400" fill="#6B7280">webman · Laravel · ThinkPHP · Hyperf</text>
    <text x="90" y="577" font-size="23" font-weight="400" fill="#6B7280">Yii2 · Yii3 · 原生 PHP</text>
    <text x="960" y="608" font-size="22" font-weight="400" fill="#6B7280" text-anchor="middle">项目宠物 · 钥匙小卫 Kee</text>
  </g>


  <!-- 由 docs/pet.svg 内联；更新宠物后请重新生成本文件 -->
  <g transform="translate(785 88) scale(1.5)">
  <title id="keeTitle">钥匙小卫 Kee — erikwang2013/jwt-webman 项目宠物</title>
  <desc id="keeDesc">一只扁平卡通的柴犬门卫：项圈上六颗金色圆钉代表六个框架适配层，脖子下挂着金色钥匙吊牌，钥匙柄上嵌着蓝色盾牌。</desc>

  <!-- 地面投影 -->
  <ellipse cx="120" cy="292" rx="72" ry="9" fill="#2B3445" opacity=".08"/>

  <g>

